<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页 | Linux & Digital Enthusiast</title>
    <style>
        :root {
            /* 浅色主题配色 */
            --bg-color: #f5f7fa;       /* 整体背景：极淡的灰蓝色 */
            --card-bg: #ffffff;        /* 卡片背景：纯白 */
            --text-primary: #2c3e50;   /* 主文字：深灰蓝 */
            --text-secondary: #3498db; /* 强调色：清爽蓝 */
            --accent: #2980b9;         /* 悬停/高亮：深蓝 */
            --border: #e1e8ed;         /* 边框：淡灰 */
            --hover-bg: #f8f9fa;       /* 悬停背景 */
            --shadow: rgba(0, 0, 0, 0.05); /* 轻微阴影 */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 720px;
            width: 100%;
            text-align: center;
        }
        /* 头部个人信息 */
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px var(--shadow);
            margin-bottom: 20px;
            object-fit: cover;
            background-color: #eee;
        }
        h1 { font-size: 1.8rem; margin-bottom: 10px; color: var(--text-primary); }
        .bio { font-size: 1rem; color: #7f8c8d; margin-bottom: 25px; }
        .tags { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 40px; }
        .tag {
            background-color: #eef2f7;
            color: var(--text-secondary);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid transparent;
            font-family: "Courier New", Courier, monospace;
            transition: all 0.2s;
        }
        .tag:hover { border-color: var(--text-secondary); }

        /* 推荐网站模块 */
        .section-title {
            text-align: left;
            font-size: 1.1rem;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid var(--text-secondary);
            color: var(--text-primary);
            font-weight: 600;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }
        .grid-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px 10px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 2px 5px var(--shadow);
        }
        .grid-item:hover {
            background-color: var(--hover-bg);
            border-color: var(--text-secondary);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.15);
        }
        .grid-icon { font-size: 1.8rem; }
        .grid-name { font-size: 0.95rem; font-weight: 500; }

        /* 底部链接与页脚 */
        .links { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }
        .link-item {
            display: block;
            background-color: var(--card-bg);
            color: var(--text-primary);
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px var(--shadow);
        }
        .link-item:hover { 
            border-color: var(--text-secondary); 
            color: var(--text-secondary);
        }
        
        footer { font-size: 0.8rem; color: #95a5a6; }
        .cursor { display: inline-block; width: 8px; height: 18px; background-color: var(--text-secondary); animation: blink 1s infinite; vertical-align: middle; margin-left: 5px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="container">
        <!-- 个人信息区 -->
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Avatar" class="avatar">
        <h1>你的名字<span class="cursor"></span></h1>
        <p class="bio">数码爱好者 / Linux 用户 / 开源探索者</p>

        <div class="tags">
            <span class="tag">🐧 Arch Linux</span>
            <span class="tag">📷 摄影</span>
            <span class="tag">⌨️ 机械键盘</span>
            <span class="tag">🐳 Docker</span>
        </div>

        <!-- 推荐网站模块 -->
        <div class="section-title">推荐网站</div>
        <div class="grid-container">
            <a href="https://github.com" target="_blank" class="grid-item">
                <span class="grid-icon">🐙</span>
                <span class="grid-name">GitHub</span>
            </a>
            <a href="https://v2ex.com" target="_blank" class="grid-item">
                <span class="grid-icon">💬</span>
                <span class="grid-name">V2EX</span>
            </a>
            <a href="https://www.linux.do" target="_blank" class="grid-item">
                <span class="grid-icon">🐧</span>
                <span class="grid-name">Linux.do</span>
            </a>
            <a href="https://www.hellogithub.com" target="_blank" class="grid-item">
                <span class="grid-icon">⭐</span>
                <span class="grid-name">HelloGitHub</span>
            </a>
            <a href="https://gitee.com/explore" target="_blank" class="grid-item">
                <span class="grid-icon">🇨🇳</span>
                <span class="grid-name">Gitee</span>
            </a>
             <a href="https://archlinux.org" target="_blank" class="grid-item">
                <span class="grid-icon">🎯</span>
                <span class="grid-name">Arch Wiki</span>
            </a>
        </div>

        <!-- 个人链接区 -->
        <div class="links">
            <a href="#" class="link-item">📂 我的博客 / 折腾笔记</a>
            <a href="mailto:your@email.com" class="link-item">📧 发送邮件联系我</a>
        </div>

        <footer>
            <p>© 2026 Built with ❤️ & Static HTML</p>
        </footer>
    </div>
</body>
</html>
